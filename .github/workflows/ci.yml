name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# Least-privilege default token: CI only needs to read the checkout.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: terraform (${{ matrix.pattern }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One job per self-contained pattern module under patterns/.
        pattern:
          - saga
          - fan-out
          - scheduled-batch
          - webhook-ingest
          - idempotent-processor
          - long-running
          - approval-workflow
          - retry-backoff
    defaults:
      run:
        working-directory: patterns/${{ matrix.pattern }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.9.8"

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init (no backend, no providers download lock)
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate -no-color

  python-tests:
    name: python-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/requirements.txt

      - name: Run unit tests
        run: python -m pytest -q
